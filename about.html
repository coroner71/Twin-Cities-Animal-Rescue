<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles.css">
    <title>Contact | Twin Cities Animal Rescue</title>
    <meta name="viewport" content="width=device-width">
</head>

<body>
    <h1>Twin Cities Animal Rescue</h1>
        <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        </nav>
<h2>Volunteer Form</h2>
<form id="contactForm"></form>
    <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name">
         <span id="nameError" class="errormessage"></span>

        <label for="email">Email</label>
        <input type="email" id="email" name="email">
        <span id="emailError" class="errormessage"></span>

        <label for="interest">Interest</label>
        <select id="interest" name="interest">
        <option value="volunteer">Volunteer Information</option>
        <option value="foster">Foster Information</option>
        <option value="adoption">Adoption Information</option>
        </select>
        <label for="availability">Availability</label>
        <input type="text" id="availability" name="availability">
        <label for="experience">Experience With Pets</label>
        <textarea id="experience" name="experience"></textarea>
        <label for="message">Short Message</label>
        <textarea id="message" name="message"></textarea>
        <span id="messageError" class="errormessage"></span>

<button type="submit">Submit</button>
    </form>
<h2>Service Area</h2>
    <p>Serving Greater Indianapolis and surrounding counties</p>
<h2>Office Hours</h2>
    <p>Monday - Friday 8:00AM to 5:00PM</p>

</body>
</html>
